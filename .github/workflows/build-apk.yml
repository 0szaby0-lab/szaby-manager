name: Build Szaby Manager APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleDebug -PsignAsDebug -PnoProguard

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/SzabyManager.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SzabyManager-APK
          path: release-output/SzabyManager.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Szaby Manager v${{ github.run_number }}
          body: |
            ?? Automatikus build #${{ github.run_number }}
            
            Telepítsd az APK-t az Android telefonodra!
          files: release-output/SzabyManager.apk
          make_latest: true

